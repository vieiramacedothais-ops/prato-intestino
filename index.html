<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2E6A4E">
<base target="_blank">
<title>Prato & Intestino</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: app de uma coluna; navegação embaixo (Hoje, Gráficos, Plano, Diário) e botão + flutuante para registrar */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E7EDE6; --ink:#1C2620; --muted:#5E6B63; --line:#D5DDD4;
  --accent:#2E6A4E; --accent-ink:#FFFFFF; --accent-soft:#D7E7DC;
  --stool:#8A5A2B; --stool-soft:#F1E4D3; --warn:#A9472F; --water:#2F6FA8;
  --prot:#2F6FA8; --carb:#C98A1B; --fat:#B04A6B; --kcal:#2E6A4E; --work:#6B4FA0;
  --display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121815; --surface:#1A221E; --surface-2:#232D28; --ink:#E6EDE8; --muted:#9AA8A0; --line:#2E3A34;
  --accent:#7CC39C; --accent-ink:#0E1A13; --accent-soft:#1F3A2C;
  --stool:#D9A66E; --stool-soft:#3A2B1C; --warn:#E58A70; --water:#4F8FD0;
  --prot:#4F8FD0; --carb:#B07A1C; --fat:#CC6A8C; --kcal:#7CC39C; --work:#A98BD6; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding:0 max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 12px}
header.top h1{font-size:26px;line-height:1.05}
.syncpill{border:0;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.syncpill i{width:8px;height:8px;border-radius:99px;background:var(--muted)}
.syncpill.ok i{background:var(--accent)} .syncpill.wait i{background:var(--carb)} .syncpill.off i{background:var(--warn)}
.hbtns{display:flex;gap:8px;align-items:center}
.chip.pend{background:var(--stool-soft)}
.gear{border:0;background:var(--surface-2);width:40px;height:40px;border-radius:999px;display:grid;place-items:center;flex:none}
.banner{background:var(--stool-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.banner button{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{font-size:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;font-size:14px}

.lvl{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.track>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.streak{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--ink);padding:3px 8px;border-radius:99px;margin-top:6px}

/* calorias */
.kcal{display:grid;grid-template-columns:128px 1fr;gap:14px;align-items:center}
.ring{position:relative;width:128px;height:128px}
.ring svg{width:128px;height:128px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.macros{display:flex;flex-direction:column;gap:9px;min-width:0}
.macro .row{display:flex;justify-content:space-between;font-size:13px;gap:6px}
.macro .row b{font-weight:600}
.macro .row span{color:var(--muted);font-variant-numeric:tabular-nums}
.macro .track>i{background:var(--c)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}

/* água e jejum */
.cups{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.cup{width:28px;height:34px;border:0;padding:0;background:none}
.cup svg{width:28px;height:34px}
.rowbtns{display:flex;gap:8px;align-items:center}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:40px;height:40px;padding:0 14px;font-weight:600}
.fastbar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:8px 0}
.fastbar i{display:block;height:100%;background:var(--accent)}
.big{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}

/* linha do tempo */
.section-title{font-family:var(--display);font-size:17px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-title small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:8px}
.entry{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.entry .time{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding-top:2px}
.entry .body{min-width:0}
.entry .kind{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:6px}
.entry .kind em{font-style:normal;color:var(--ink);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.entry.meal .kind{color:var(--accent)} .entry.stool .kind{color:var(--stool)} .entry.workout .kind{color:var(--work)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ingrow{display:grid;grid-template-columns:1fr 1fr 72px 28px;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.ingrow input,.ingrow select{padding:8px;font-size:14px;min-width:0}
.ingrow>:nth-child(1){grid-column:1/3}.ingrow>:nth-child(2){grid-column:3}.ingrow>:nth-child(3){grid-column:1;grid-row:2}.ingrow>:nth-child(4){grid-column:2/5;grid-row:2}.ingrow>:nth-child(5){grid-column:4;grid-row:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.diet summary{display:flex;justify-content:space-between;align-items:center;gap:12px;list-style:none;cursor:pointer}
.diet summary::-webkit-details-marker{display:none}
.dbar{flex:none;width:70px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.dbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.dgroup{border-top:1px solid var(--line);padding:10px 0 4px}
.dg-head{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.dg-ok{margin-left:auto;color:var(--accent);font-weight:700}
.dgroup.ok .dg-head b{color:var(--accent)}
.dopt{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.dopt input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--accent)}
.dopt>span{display:flex;flex-direction:column;gap:1px;min-width:0}
.dopt-t{font-size:15px}
.dopt.on .dopt-t{font-weight:600}
.optrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.optrow .pill{flex:1;text-align:left}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:32px;height:32px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:18px;color:var(--ink)}
.stepper span{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.exlist{display:flex;flex-direction:column;gap:10px}
.exitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.exitem .x{width:30px;height:30px;font-size:16px}
.sets{display:flex;flex-direction:column;gap:6px;margin:8px 0 4px}
.setrow{display:grid;grid-template-columns:22px 1fr auto 1fr 40px 28px;gap:6px;align-items:center;font-size:13px}
.setrow input{padding:8px 6px;text-align:center}
.setrow .sn{font-weight:700;color:var(--muted);text-align:center}
.setrow.done input{background:var(--accent-soft);border-color:var(--accent)}
.setok{width:40px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted)}
.setok[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.setdel{border:0;background:none;color:var(--muted);font-size:18px}
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wstats span{display:block;font-size:12px;color:var(--muted)}
.wstats b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.picker{display:flex;flex-direction:column;gap:8px;border:1px solid var(--accent);border-radius:12px;padding:10px;background:var(--surface)}
.picker .pill.small{font-size:12px;padding:5px 9px}
.plist{max-height:280px;overflow-y:auto;display:flex;flex-direction:column}
.prow{display:flex;justify-content:space-between;gap:8px;align-items:center;border:0;border-top:1px solid var(--line);background:none;padding:9px 2px;text-align:left;color:var(--ink);font:inherit;font-size:14px}
.prow[disabled]{opacity:.4}

.grid3 .f{font-weight:500}
.entry .title{font-weight:600;margin-top:2px}
.entry .sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.mline{display:flex;gap:10px;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs img{width:60px;height:60px;object-fit:cover;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink);border:0}
.chip.badge{background:var(--accent-soft)}
.chip.alert{background:var(--warn);color:#fff}
.score{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:99px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--ink)}
.stoolrow{display:flex;gap:10px;align-items:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.nav .row{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .plus{width:54px;height:54px;border-radius:999px;background:var(--accent);color:var(--accent-ink);margin:-26px auto 0;box-shadow:0 4px 14px rgba(0,0,0,.18);display:grid;place-items:center;padding:0}

/* botões */
.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.stool{background:var(--stool);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}

/* painel */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:41;background:var(--bg);border-radius:20px 20px 0 0;max-height:calc(var(--vvh,100vh) * 0.94);display:flex;flex-direction:column;
  padding:0 max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left))}
.sheet .inner{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 0 10px;gap:8px}
.sheet-head h3{font-size:20px}
.x{border:0;background:var(--surface-2);border-radius:999px;width:36px;height:36px;font-size:18px;line-height:1;flex:none}
.sheet-body{overflow-y:auto;flex:1;min-height:0;padding-bottom:14px;display:flex;flex-direction:column;gap:14px}
.sheet-foot{padding:10px 0 14px;display:flex;gap:10px;border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.menu b{font-family:var(--display);font-size:17px}
.menu span{font-size:13px;color:var(--muted)}
label.f,.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.f .hint{font-weight:400;font-size:13px;color:var(--muted)}
input[type=datetime-local],input[type=time],input[type=number],textarea,input[type=text],input[type=password],select{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 input{padding:8px 6px;text-align:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opts{display:flex;flex-direction:column;gap:6px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble.me img{width:120px;height:120px;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
.thinking{color:var(--muted);font-style:italic}
.draft{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.item{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .top b{font-weight:600}
.item .nums{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.totals div{background:var(--surface-2);border-radius:10px;padding:6px 2px}
.totals b{display:block;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.totals span{font-size:11px;color:var(--muted)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;border-radius:20px;padding:11px 14px;max-height:120px}
.iconbtn{border:0;width:46px;height:46px;flex:none;border-radius:999px;background:var(--surface-2);display:grid;place-items:center;position:relative;overflow:hidden}
.iconbtn.send{background:var(--accent);color:var(--accent-ink)}
.overlay-file{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.pending{display:flex;gap:6px;flex-wrap:wrap}
.pending .p{position:relative}
.pending img{width:58px;height:58px;object-fit:cover;border-radius:10px}
.pending .p button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-size:12px}

/* bristol */
.bristol{display:grid;gap:6px}
.bopt{display:grid;grid-template-columns:28px 76px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px}
.bopt .n{font-family:var(--display);font-weight:700;font-size:18px;color:var(--stool);text-align:center}
.bopt .t{font-weight:600;font-size:14px} .bopt .d{font-size:13px;color:var(--muted)}
.bopt[aria-pressed="true"]{border-color:var(--stool);background:var(--stool-soft);box-shadow:inset 0 0 0 1px var(--stool)}
.swatch{width:34px;height:34px;border-radius:999px;border:2px solid var(--line)}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}

/* gráficos */
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:13px;min-height:20px;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.axis{fill:var(--muted);font-size:10px;font-family:var(--body)}
.grid{stroke:var(--line);stroke-width:1}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stat b{font-family:var(--display);font-size:20px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.insight ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.insight h4{margin:12px 0 0;font-size:14px}

/* plano */
.day-plan{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.day-plan:first-of-type{border-top:0;margin-top:0;padding-top:0}
.pmeal{display:flex;flex-direction:column;gap:2px;padding:8px 0}
.pmeal .r{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.recipe-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:10px 0;color:var(--ink);font:inherit}
.recipe-row:first-child{border-top:0}
.recipe-row b{display:block;font-size:15px}
.recipe-row .r{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.pick summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none}
.pick summary::-webkit-details-marker{display:none}
.pick summary::after{content:'▾';color:var(--muted);margin-left:auto}
.pick[open] summary::after{content:'▴'}
.pick .seg .pill{text-align:left}
.shop h4{margin:12px 0 4px;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.shop label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:15px;border-top:1px solid var(--line)}

<script>
(() => {
/* ================= utilidades ================= */
const $ = (s, el=document) => el.querySelector(s);
const h = (tag, attrs={}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
};
const fill = (el, ...kids) => { el.replaceChildren(...kids.flat(2).filter(k=>k!=null&&k!==false)); return el; };
const svgEl = (html) => { const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; };
/* ================= armazenamento local + sincronização ================= */
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('prato-intestino', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction('kv', mode); const q = fn(t.objectStore('kv')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }));
  return { get: k => tx('readonly', s => s.get(k)), set: (k, v) => tx('readwrite', s => s.put(v, k)), del: k => tx('readwrite', s => s.delete(k)) };
})();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
let cfg = null, outbox = [], syncing = false, syncErr = '', lastSync = 0;
const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return ''; } })();
async function api(action, payload, timeoutMs = 90000) {
  if (!cfg) throw new Error('Conecte o app à sua conta Google nas configurações.');
  if (!navigator.onLine) throw new Error('Sem internet agora.');
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), timeoutMs);
  let res;
  try { res = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token: cfg.token, tz: TZ, action }, payload)), signal: ctl.signal }); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'A conexão demorou demais.' : 'Sem conexão com o Google agora.'); }
  finally { clearTimeout(tm); }
  let j; try { j = await res.json(); } catch (e) { throw new Error('O Google respondeu algo inesperado. Confira o link da conexão.'); }
  if (!j.ok) throw new Error(j.error || 'Erro no Google.');
  return j.data;
}
const QUEUED = new Set(['saveRoutines','saveEntry','deleteEntry','setWater','saveWeight','deleteWeight','startFast','stopFast','saveProfile','saveInsight','savePlan','setReminders']);
const COALESCE = { setWater: a => 'w:' + a[0], saveProfile: () => 'p', saveInsight: () => 'i', savePlan: () => 'pl', setReminders: () => 'r', saveRoutines: () => 'rt' };
function localResult(fn, args) {
  const a = args[0];
  switch (fn) {
    case 'saveEntry': { a.id = a.id || uid(); const c = JSON.parse(JSON.stringify(a)); delete c.dataStr; delete c.horaStr; return c; }
    case 'saveWeight': a.id = a.id || uid(); return { id: a.id, at: a.at, kg: a.kg };
    case 'startFast': return { start: a.start, goalH: a.goalH };
    case 'stopFast': { const cur = state.fastCurrent || { start: a.end, goalH: goals().jejum }; return { id: uid(), start: cur.start, end: a.end, goalH: cur.goalH }; }
    case 'saveProfile': return JSON.parse(JSON.stringify(a));
    case 'setReminders': return { times: (a || []).map(r => ({ time: r.time, label: r.label })) };
    default: return true;
  }
}
async function run(fn, ...args) {
  if (QUEUED.has(fn)) {
    const res = localResult(fn, args);
    const ckey = COALESCE[fn] ? COALESCE[fn](args) : null;
    if (ckey) outbox = outbox.filter(o => o.ckey !== ckey);
    outbox.push({ qid: uid(), fn, args: JSON.parse(JSON.stringify(args)), ckey });
    persistSoon(); updateSyncPill(); syncSoon();
    return res;
  }
  if (fn === 'askGemini') return api('askGemini', { prompt: args[0], images: args[1] || [] }, 150000);
  if (fn === 'setKey') return api('setKey', { key: args[0] });
  if (fn === 'getAll') return api('getAll', {});
  throw new Error('Ação desconhecida');
}
const DATA_KEYS = ['routines','workoutCurrent','entries','water','weights','fasts','fastCurrent','profile','plan','insight','reminders','info'];
let persistT = null;
function persistSoon() {
  clearTimeout(persistT);
  persistT = setTimeout(() => {
    const d = {}; DATA_KEYS.forEach(k => d[k] = state[k]);
    idb.set('data', d).catch(() => {}); idb.set('outbox', outbox).catch(() => {});
  }, 250);
}
let syncT = null;
function syncSoon(ms = 1500) { clearTimeout(syncT); syncT = setTimeout(sync, ms); }
async function sync() {
  if (syncing || !cfg) return;
  if (!navigator.onLine) { updateSyncPill(); return; }
  syncing = true; updateSyncPill();
  const first = !state.loaded;
  try {
    const ops = outbox.slice();
    const r = await api('sync', { ops });
    const sent = new Set(ops.map(o => o.qid));
    outbox = outbox.filter(o => !sent.has(o.qid));
    (r.errors || []).forEach(er => toast('Não consegui gravar um registro no Drive: ' + er.error));
    if (!outbox.length) {
      const reacoes = {}; state.entries.forEach(e => { if (e.reacao) reacoes[e.id] = e.reacao; });
      const localPlan = state.plan;
      Object.assign(state, r.all, { loaded: true });
      // se o plano do celular é mais novo que o da planilha (ex.: o salvamento falhou), fica o do celular
      if (localPlan && localPlan.rev && (!state.plan || !(state.plan.rev >= localPlan.rev))) state.plan = localPlan;
      state.entries.forEach(e => { if (reacoes[e.id]) e.reacao = reacoes[e.id]; });
      state.entries.sort((a, b) => b.at - a.at);
    }
    syncErr = ''; lastSync = Date.now();
    persistSoon(); banner(); render();
    if (first && !state.profile) openOnboarding();
    processPending();
  } catch (e) {
    syncErr = errMsg(e);
    if (first && !state.loaded) { state.loaded = true; render(); }
  } finally {
    syncing = false; updateSyncPill();
    if (outbox.length && navigator.onLine && !syncErr) syncSoon(3000);
  }
}
function updateSyncPill() {
  const p = document.getElementById('syncpill'); if (!p) return;
  let cls = 'ok', txt = 'Sincronizado';
  if (!cfg) { cls = 'off'; txt = 'Não conectado'; }
  else if (syncing) { cls = 'wait'; txt = 'Sincronizando…'; }
  else if (!navigator.onLine) { cls = 'off'; txt = outbox.length ? 'Offline · ' + outbox.length + ' pendente' + (outbox.length > 1 ? 's' : '') : 'Offline'; }
  else if (syncErr) { cls = 'off'; txt = 'Erro ao sincronizar'; }
  else if (outbox.length) { cls = 'wait'; txt = outbox.length + ' pendente' + (outbox.length > 1 ? 's' : ''); }
  p.className = 'syncpill ' + cls; p.querySelector('span').textContent = txt;
}
window.addEventListener('online', () => { updateSyncPill(); syncSoon(500); });
window.addEventListener('offline', updateSyncPill);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastSync > 60000) syncSoon(300); });
setInterval(() => { if (outbox.length) syncSoon(100); }, 60000);

/* refeições registradas sem internet: a IA calcula quando a conexão voltar */
let pendingBusy = false;
async function processPending() {
  if (pendingBusy || !navigator.onLine || !state.info || !state.info.hasKey) return;
  const list = state.entries.filter(e => e.type === 'meal' && e.pendente);
  if (!list.length) return;
  pendingBusy = true;
  toast('Calculando ' + list.length + (list.length > 1 ? ' refeições registradas' : ' refeição registrada') + ' sem internet…');
  for (const e of list) {
    try {
      const imgs = (await idb.get('img:' + e.id)) || [];
      const r = await run('askGemini', mealPrompt(e, e.pendente.texto || [], imgs.length, ''), imgs);
      const upd = Object.assign({}, e);
      applyAI(upd, r);
      delete upd.pendente; upd.pendente = null;
      const saved = await saveEntry(upd);
      if (saved) idb.del('img:' + e.id).catch(() => {});
    } catch (err) { if (/internet|conexão/i.test(errMsg(err))) break; }
  }
  pendingBusy = false;
}
function applyAI(d, r) {
  if (!r) return;
  if (Array.isArray(r.itens)) d.items = itemsFromAI(r.itens);
  if (r.resumo) d.resumo = String(r.resumo).slice(0,120);
  if (r.refeicao && MEALS.includes(r.refeicao)) d.meal = r.refeicao;
  if (r.nota) d.score = Math.max(1, Math.min(10, Math.round(+r.nota)));
  if (Array.isArray(r.selos)) d.selos = r.selos.slice(0,3).filter(s=>s&&s.nome).map(s=>({nome:String(s.nome).slice(0,30), porque:String(s.porque||'').slice(0,160)}));
  if (r.reacao) d.reacao = String(r.reacao).slice(0,140);
}
function mealPrompt(draft, transcript, nImgs, text) {
  return 'Você é uma nutricionista que ajuda uma pessoa a registrar refeições num diário, em português do Brasil.\n'+
    'Responda SOMENTE com um objeto JSON neste formato:\n'+
    '{"refeicao": uma de '+JSON.stringify(MEALS)+' ou null,\n "resumo": frase curta (até 70 caracteres),\n "itens": [{"nome": "alimento", "quantidade": "porção caseira, ex. 4 colheres de sopa (100 g)", "kcal": número, "proteina": gramas, "carboidratos": gramas, "gorduras": gramas, "fibras": gramas}],\n "nota": número de 1 a 10 para o equilíbrio nutricional da refeição,\n "selos": até 3 conquistas positivas [{"nome": "até 3 palavras, ex. Rico em fibras", "porque": "1 frase explicando"}] (lista vazia se não houver),\n "mensagem": 1-2 frases acolhedoras confirmando o que entendeu; se a porção for muito incerta, faça UMA pergunta curta}\n'+
    'Regras: use valores da Tabela TACO/TBCA para alimentos brasileiros quando possível. Estime porções realistas. Valores por item, já multiplicados pela quantidade. '+
    'Se a foto for de um rótulo ou tabela nutricional, use os valores do rótulo para a quantidade consumida (se não souber quantas porções, considere 1). '+
    'Mantenha os itens já registrados a menos que a pessoa peça para mudar. Tom gentil, sem culpa.\n'+
    (nImgs ? 'Há '+nImgs+' foto(s) anexada(s).\n' : '')+
    'Registro atual: '+JSON.stringify({refeicao:draft.meal, resumo:draft.resumo, itens:(draft.items||[]).map(i=>({nome:i.nome,quantidade:i.quantidade,kcal:i.kcal,proteina:i.p,carboidratos:i.c,gorduras:i.g,fibras:i.f}))})+'\n'+
    'Horário: '+new Date(draft.at).toLocaleString('pt-BR')+'\n'+
    'O que a pessoa escreveu: '+JSON.stringify(transcript)+(text ? '\nMensagem mais recente: '+JSON.stringify(text) : '');
}
const pad = n => String(n).padStart(2,'0');
const toLocalInput = ms => { const d=new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); };
const fromLocalInput = s => new Date(s).getTime();
const dayKey = ms => { const d=new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const hm = ms => { const d=new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const dataStr = ms => new Date(ms).toLocaleDateString('pt-BR');
const nf = (n, d=0) => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:d, minimumFractionDigits:0});
const fmtDay = key => {
  if (key===dayKey(Date.now())) return 'Hoje';
  if (key===dayKey(Date.now()-864e5)) return 'Ontem';
  const [y,m,d]=key.split('-').map(Number);
  const s = new Date(y,m-1,d).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  return s.charAt(0).toUpperCase()+s.slice(1);
};
const shortDay = key => { const [y,m,d]=key.split('-').map(Number); return d+'/'+m; };
const lastDays = n => { const out=[]; for(let i=n-1;i>=0;i--){ const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-i); out.push(dayKey(d.getTime())); } return out; };
function toast(msg){ const t=h('div',{class:'toast',role:'status'},msg); document.body.append(t); setTimeout(()=>t.remove(),2600); }
const errMsg = e => (e && e.message) ? e.message.replace(/^Error:\s*/,'') : 'Algo deu errado. Tente de novo.';

/* ================= dados fixos ================= */
const MEALS = ['Café da manhã','Lanche da manhã','Almoço','Lanche da tarde','Jantar','Ceia','Petisco'];
const guessMeal = ms => { const hr=new Date(ms).getHours(); return hr<10?'Café da manhã':hr<12?'Lanche da manhã':hr<15?'Almoço':hr<18?'Lanche da tarde':hr<22?'Jantar':'Ceia'; };
const BRISTOL = [null,
  {t:'Bolinhas duras', d:'Pedaços separados e duros, difíceis de sair', g:'Constipação'},
  {t:'Salsicha encaroçada', d:'Formato de salsicha, mas com caroços', g:'Constipação leve'},
  {t:'Salsicha com rachaduras', d:'Formato de salsicha com fissuras na superfície', g:'Normal'},
  {t:'Lisa e macia', d:'Como uma cobra, lisa e macia', g:'Ideal'},
  {t:'Pedaços macios', d:'Bolinhas moles com bordas definidas, saem fácil', g:'Falta de fibra'},
  {t:'Pastosa', d:'Pedaços fofos de bordas irregulares', g:'Diarreia leve'},
  {t:'Líquida', d:'Totalmente líquida, sem pedaços sólidos', g:'Diarreia'}];
const COLORS = [{k:'Marrom',c:'#7A4A22'},{k:'Marrom claro',c:'#B07A43'},{k:'Escura',c:'#3A2414'},{k:'Amarelada',c:'#C9A43A'},
  {k:'Esverdeada',c:'#5E7A35'},{k:'Preta',c:'#141210'},{k:'Avermelhada',c:'#9E3B2C'},{k:'Clara / acinzentada',c:'#CFC6B4'}];
const DOR = ['Sem dor','Leve','Moderada','Forte'];
const ACTIVITY = [{k:1.2,t:'Sedentária',d:'Pouco ou nenhum exercício'},{k:1.375,t:'Leve',d:'Exercício 1 a 3 vezes por semana'},{k:1.55,t:'Moderada',d:'Exercício 3 a 5 vezes por semana'},{k:1.725,t:'Intensa',d:'Exercício 6 a 7 vezes por semana'},{k:1.9,t:'Muito intensa',d:'Treino pesado diário ou trabalho físico'}];
const GOALS = [{k:'perder',t:'Perder peso'},{k:'manter',t:'Manter o peso'},{k:'ganhar',t:'Ganhar massa'}];

function bristolSvg(n, w=64, hgt=30){

  switch(n){
    case 1: inner = [[10,15,5],[24,12,5.5],[38,17,5],[52,13,5.5]].map(([x,y,r])=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+f+'"/>').join(''); break;
    case 2: inner = [10,18,26,34,42,50].map((x,i)=>'<circle cx="'+(x+2)+'" cy="'+(15+(i%2?-1.5:1.5))+'" r="6.5" fill="'+f+'"/>').join(''); break;

    case 4: inner = '<path d="M6 18 C 16 6, 28 24, 40 14 S 56 10, 58 12" stroke="'+f+'" stroke-width="9" fill="none" stroke-linecap="round"/>'; break;

    case 6: inner = '<path d="M8 18 q3-8 9-5 q4-6 10-1 q6-5 10 1 q7-3 9 4 q6 2 4 7 q-4 4-10 2 q-5 3-11 0 q-6 3-11-1 q-7 1-10-7z" fill="'+f+'" opacity=".9"/>'; break;
    case 7: inner = '<path d="M6 20 q10-6 22-2 q12 4 30-2 q2 6-6 8 q-14 3-28 1 q-14 1-18-5z" fill="'+f+'" opacity=".55"/><circle cx="48" cy="9" r="3" fill="'+f+'" opacity=".55"/><circle cx="18" cy="9" r="2.4" fill="'+f+'" opacity=".55"/>'; break;
  }
  return '<svg width="'+w+'" height="'+hgt+'" viewBox="0 0 64 30" aria-hidden="true">'+inner+'</svg>';
}

/* ================= estado ================= */
const state = { tab:'hoje', loaded:false, routines:[], workoutCurrent:null, entries:[], water:{}, weights:[], fasts:[], fastCurrent:null, profile:null, plan:null, insight:null, reminders:{times:[]}, info:{}, chartDays:7 };
const P = () => state.profile || {};
state.info = state.info || {};
const goals = () => { const p=P(); return {kcal:p.metaKcal||2000, p:p.metaProt||90, c:p.metaCarb||230, g:p.metaGord||65, f:p.metaFibra||25, agua:p.metaAgua||8, copo:p.copoMl||250, jejum:p.jejumH||16}; };
const mealTotals = e => (e.items||[]).reduce((t,i)=>({kcal:t.kcal+(+i.kcal||0), p:t.p+(+i.p||0), c:t.c+(+i.c||0), g:t.g+(+i.g||0), f:t.f+(+i.f||0)}), {kcal:0,p:0,c:0,g:0,f:0});
function dayTotals(key){
  const t = {kcal:0,p:0,c:0,g:0,f:0,meals:0,stools:0,workouts:0,workMin:0,workKcal:0};
  state.entries.forEach(e=>{ if (dayKey(e.at)!==key) return; if (e.type==='meal'){ const m=mealTotals(e); t.kcal+=m.kcal;t.p+=m.p;t.c+=m.c;t.g+=m.g;t.f+=m.f;t.meals++; }
    else if (e.type==='workout'){ t.workouts++; t.workMin+=(+e.min||0); t.workKcal+=(+e.kcal||0); } else t.stools++; });
  return t;
}

/* ================= sequência de dias registrando ================= */
function petStats(){
  const meals = state.entries.filter(e=>e.type==='meal');
  const stools = state.entries.filter(e=>e.type==='stool').length;
  const treinos = state.entries.filter(e=>e.type==='workout').length;
  const g = goals();
  const waterDays = Object.values(state.water).filter(c=>c>=g.agua).length;
  const xp = meals.length*10 + stools*5 + treinos*15 + state.weights.length*5 + waterDays*10 + state.fasts.filter(f=>(f.end-f.start)/36e5>=f.goalH).length*10;
  const level = 1 + Math.floor(xp/120);
  const days = new Set(meals.map(m=>dayKey(m.at)));
  let streak = 0; const d = new Date(); d.setHours(12,0,0,0);
  if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate()-1);
  while (days.has(dayKey(d.getTime()))) { streak++; d.setDate(d.getDate()-1); }
  return {xp, level, into: xp%120, streak};
}
/* ================= carregamento ================= */
async function boot(){

const WEEKDAYS = ['domingo','segunda','terca','quarta','quinta','sexta','sabado'];
const isOptPlan = p => !!(p && p.formato==='opcoes');
function todayGroups(plan){

  if (isOptPlan(plan)) return plan.dias.map(d=>({nome:d.dia, horario:d.horario||'', opcoes:d.refeicoes||[]}));
  const wd = WEEKDAYS[new Date().getDay()];

// resumo de uma lista de exercícios: exercícios, séries, reps, volume, mais pesado, média
function exStats(ex){
  const sets = (ex||[]).flatMap(e=>(e.sets||[]).filter(s=>+s.reps>0));
  const reps = sets.reduce((a,s)=>a+(+s.reps||0),0), vol = sets.reduce((a,s)=>a+(+s.kg||0)*(+s.reps||0),0);
  return {ex:(ex||[]).filter(e=>(e.sets||[]).some(s=>+s.reps>0)).length, sets:sets.length, reps, vol:Math.round(vol), max:Math.max(0,...sets.map(s=>+s.kg||0)), avg: reps ? Math.round(vol/reps*10)/10 : 0};
}

  return state.entries.filter(e=>e.type==='workout' && e.id!==skipId && (beforeAt==null || e.at<beforeAt) && (e.ex||[]).some(x=>normName(x.nome)===n))

  if (up && lo) out.push('Corpo todo'); else if (up) out.push('Superiores'); else if (lo) out.push('Inferiores');

function openMeal(existing, preset){

  const icon = d => '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';

  const composer = h('div',{class:'composer'},
    lab('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',cam),
    lab('<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="M20 15l-5-5-9 9"/>',gal),
    ta, h('button',{class:'iconbtn send','aria-label':'Enviar',html:icon('<path d="M5 12h13M13 6l6 6-6 6"/>'),onclick:()=>send()}));

  const saveBtn = h('button',{class:'btn primary',onclick:async()=>{

    if (saved){ saved.reacao = draft.reacao; s.close(); toast(saved.pendente ? 'Refeição salva. Calculo as calorias quando a internet voltar.' : 'Refeição salva · '+nf(mealTotals(saved).kcal)+' kcal'); }

      h('div',{class:'top'}, h('b',{}, it.nome, it.quantidade?h('span',{class:'muted',style:'font-weight:400'},' · '+it.quantidade):null), h('span',{class:'nums'}, nf(it.kcal)+' kcal')),

      h('div',{class:'seg'}, h('button',{class:'chip',onclick:edit},'corrigir valores'), h('button',{class:'chip',onclick:()=>{draft.items.splice(i,1);drawDraft();}},'remover')));

      row.replaceChildren(h('div',{class:'grid2'},nome,qt), h('div',{class:'grid4'}, fld('kcal','Kcal'), fld('p','Prot.','0.1'), fld('c','Carb.','0.1'), fld('g','Gord.','0.1')),

      (draft.selos&&draft.selos.length) ? h('div',{class:'chips'}, draft.selos.map(sl=>h('button',{class:'chip badge',onclick:()=>toast(sl.porque||sl.nome)},'🏅 '+sl.nome))) : null,

  function addBubble(role, text, imgs=[]){ const b = h('div',{class:'bubble '+role}, imgs.map(s=>h('img',{src:s,alt:'Foto enviada'})), text?h('div',{},text):null); chat.append(b); b.scrollIntoView({block:'end',behavior:'smooth'}); return b; }
  async function send(){
    const text = ta.value.trim();

    const fresh = pending; pending=[]; drawPending();
    ta.value=''; ta.style.height='auto';
    addBubble('me', text, fresh.map(p=>p.thumb));

function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=u; }); }
function resize(img, max){ const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c; }
async function prepPhoto(file){ const img = await loadImg(file); return { full: resize(img,1024).toDataURL('image/jpeg',.82).split(',')[1], thumb: resize(img,240).toDataURL('image/jpeg',.6) }; }

async function saveEntry(entry){

  try {
    const saved = await run('saveEntry', entry);
    state.entries = [saved, ...state.entries.filter(e=>e.id!==saved.id)].sort((a,b)=>b.at-a.at);
    render(); return saved;
  } catch(e){ toast('Não salvou: '+errMsg(e)); return null; }
}
async function deleteEntry(e){
  try { await run('deleteEntry', e.type, e.id); state.entries = state.entries.filter(x=>x.id!==e.id); render(); toast('Registro apagado'); }
  catch(err){ toast('Não consegui apagar. Tente de novo.'); }
}

    warn.hidden = !alert; warn.textContent = alert ? 'Sangue, fezes pretas, avermelhadas ou muito claras podem ter várias causas. Se acontecer de novo ou vier com outros sintomas, vale conversar com um médico.' : '';

  let confirming = false;
  const del = h('button',{class:'btn danger',onclick:async()=>{ if (!confirming){ confirming=true; del.textContent='Toque de novo para apagar'; return; } s.close(); await deleteEntry(e); }},'Apagar');
  const edit = h('button',{class:'btn ghost',onclick:()=>{ s.close(); e.type==='meal' ? openMeal(e) : e.type==='workout' ? openWorkout(e) : openStool(e); }},'Editar');
  const body = e.type==='workout' ? workoutDetail(e) : h('div',{class:'timeline'}, entryCard(e,false));
  if (e.type==='meal'){
    (e.items||[]).forEach(it=>body.append(h('div',{class:'item'}, h('div',{class:'top'}, h('b',{}, it.nome, it.quantidade?h('span',{class:'muted',style:'font-weight:400'},' · '+it.quantidade):null), h('span',{class:'nums'},nf(it.kcal)+' kcal')),
      h('div',{class:'nums'},'P '+nf(it.p,1)+'g · C '+nf(it.c,1)+'g · G '+nf(it.g,1)+'g · Fibra '+nf(it.f,1)+'g'))));
    (e.selos||[]).forEach(sl=>body.append(h('div',{class:'card',style:'margin:0'}, h('b',{},'🏅 '+sl.nome), h('div',{class:'muted small'},sl.porque))));
  }
  const s = openSheet(e.type==='meal' ? (e.meal||'Refeição') : e.type==='workout' ? (e.nome || 'Treino · '+(e.tipo||'')) : 'Evacuação · tipo '+e.bristol, body, [del, edit]);
}

/* ================= GRÁFICOS ================= */
function chartBox(title, legend, svg, cap){ return h('div',{class:'card chart'}, h('h3',{style:'margin-bottom:6px'},title), legend, svg, cap); }
function legendEl(items){ return h('div',{class:'legend'}, items.map(([l,c])=>h('span',{},h('span',{class:'dot',style:'--c:var('+c+')'}),l))); }
function niceMax(v){ if (v<=0) return 10; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
// barras empilhadas (ou simples) com linha de meta; toque mostra valores
function barChart(keys, series, opts){
  const W=340, H=180, L=36, Rr=8, T=10, B=24, iw=W-L-Rr, ih=H-T-B;
  const totals = keys.map((_,i)=>series.reduce((s,se)=>s+se.values[i],0));
  const rawMax = Math.max(opts.goal||0, ...totals)*1.05;
  const max = opts.int ? Math.max(4, Math.ceil(rawMax/4)*4) : niceMax(rawMax);
  const y = v => T+ih-(v/max)*ih;
  const bw = Math.min(26, iw/keys.length*0.62), step = iw/keys.length;
  let g = '';
  for (let k=0;k<=4;k++){ const v=max*k/4, yy=y(v); g+='<line class="grid" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+yy+'" y2="'+yy+'"/><text class="axis" x="'+(L-6)+'" y="'+(yy+3)+'" text-anchor="end">'+nf(v)+'</text>'; }
  const labelEvery = keys.length>14 ? 5 : keys.length>7 ? 2 : 1;
  keys.forEach((k,i)=>{
    const x = L+step*i+(step-bw)/2; let acc = 0;
    series.forEach((se,si)=>{ const v=se.values[i]; if (v<=0) return; const y0=y(acc), y1=y(acc+v); const top = si===series.length-1 || series.slice(si+1).every(s2=>s2.values[i]<=0);
      const hgt = Math.max(1, y0-y1-(acc>0?2:0));
      g += top ? '<path d="M'+x+' '+(y1+hgt)+' V'+(y1+Math.min(4,hgt))+' q0 -4 4 -4 H'+(x+bw-4)+' q4 0 4 4 V'+(y1+hgt)+' z" fill="var('+se.color+')"/>' : '<rect x="'+x+'" y="'+y1+'" width="'+bw+'" height="'+hgt+'" fill="var('+se.color+')"/>';
      acc += v; });
    if (i%labelEvery===0 || i===keys.length-1) g+='<text class="axis" x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+shortDay(k)+'</text>';
    g += '<rect data-i="'+i+'" x="'+(L+step*i)+'" y="'+T+'" width="'+step+'" height="'+ih+'" fill="transparent" style="cursor:pointer"><title>'+shortDay(k)+'</title></rect>';
  });
  if (opts.goal){ const gy=y(opts.goal); g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/><text class="axis" x="'+(W-Rr)+'" y="'+(gy-4)+'" text-anchor="end" style="fill:var(--ink);font-weight:600">meta '+nf(opts.goal)+'</text>'; }
  const svg = svgEl('<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+opts.label+'">'+g+'</svg>');
  const cap = h('div',{class:'cap'}, opts.hint||'Toque numa barra para ver os valores.');
  svg.addEventListener('click', ev => { const i = ev.target.getAttribute && ev.target.getAttribute('data-i'); if (i==null) return; cap.textContent = fmtDay(keys[i])+': '+opts.fmt(+i); });
  return {svg, cap};
}
function lineChart(points, opts){
  const W=340, H=170, L=38, Rr=10, T=12, B=24, iw=W-L-Rr, ih=H-T-B;
  const vals = points.map(p=>p.v); let lo=Math.min(...vals), hi=Math.max(...vals); if (hi-lo<2){ lo-=1; hi+=1; } const padv=(hi-lo)*0.15; lo-=padv; hi+=padv;
  const t0 = points[0].t, t1 = points[points.length-1].t || t0+1;
  const x = t => L + (t1===t0 ? iw/2 : (t-t0)/(t1-t0)*iw), y = v => T+ih-(v-lo)/(hi-lo)*ih;
  let g='';
  for (let k=0;k<=3;k++){ const v=lo+(hi-lo)*k/3, yy=y(v); g+='<line class="grid" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+yy+'" y2="'+yy+'"/><text class="axis" x="'+(L-6)+'" y="'+(yy+3)+'" text-anchor="end">'+nf(v,1)+'</text>'; }
  g += '<polyline points="'+points.map(p=>x(p.t)+','+y(p.v)).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  points.forEach((p,i)=>{ g+='<circle cx="'+x(p.t)+'" cy="'+y(p.v)+'" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><circle data-i="'+i+'" cx="'+x(p.t)+'" cy="'+y(p.v)+'" r="14" fill="transparent" style="cursor:pointer"/>'; });
  [0, points.length-1].forEach(i=>{ const p=points[i]; g+='<text class="axis" x="'+x(p.t)+'" y="'+(H-8)+'" text-anchor="'+(i?'end':'start')+'">'+dataStr(p.t).slice(0,5)+'</text>'; });
  if (opts.goal){ const gy=y(opts.goal); if (gy>T && gy<T+ih) g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/>'; }
  const svg = svgEl('<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+opts.label+'">'+g+'</svg>');
  const cap = h('div',{class:'cap'}, 'Toque num ponto para ver o valor.');
  svg.addEventListener('click', ev => { const i = ev.target.getAttribute && ev.target.getAttribute('data-i'); if (i==null) return; const p=points[+i]; cap.textContent = dataStr(p.t)+': '+nf(p.v,1)+' kg'; });
  return {svg, cap};
}

  // análise da IA
  v.append(insightCard());

      'Metas diárias: '+JSON.stringify(goals())+'. Dias sem registro podem ser só esquecimento. Tom gentil, sem culpa, em português do Brasil.\nDiário: '+JSON.stringify(resumo);
    try { const r = await run('askGemini', prompt, []); r.geradoEm = Date.now(); state.insight = r; run('saveInsight', r).catch(()=>{}); render(); }

  }

/* ================= PLANO ================= */
/* O plano pode vir da IA ou de um PDF da nutricionista. Cada refeição pode ter:
   ingredientes [{nome, qtd, un, cat}] (para a lista de compras) e passos [...] (modo de preparo detalhado).
   plan.sel = refeições escolhidas para a semana · plan.ok = itens já comprados */
const CATS = ['Hortifrúti','Carnes, peixes e ovos','Laticínios','Grãos e cereais','Padaria','Mercearia','Temperos','Bebidas','Congelados','Outros'];
const ING_JSON = '"ingredientes":[{"nome":"nome simples do ingrediente, ex. arroz branco","quantidade":número ou null,"unidade":"g" | "ml" | "unidade" | "fatia" | "colher de sopa" | "colher de chá" | "xícara" | "a gosto","categoria":uma de '+JSON.stringify(CATS)+'}]';
const normName = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function normIng(list){
  return (Array.isArray(list)?list:[]).filter(i=>i&&i.nome).map(i=>{
    const q = i.quantidade!=null ? +i.quantidade : (i.qtd!=null ? +i.qtd : NaN);
    const cat = CATS.includes(i.categoria||i.cat) ? (i.categoria||i.cat) : 'Outros';
    return {nome:String(i.nome).slice(0,60), qtd:isFinite(q)&&q>0 ? Math.round(q*100)/100 : null, un:String(i.unidade||i.un||'').slice(0,20), cat};
  });
}
function normPlan(r, fonte, nome){
  const dias = (r.dias||[]).filter(d=>d&&Array.isArray(d.refeicoes)).map(d=>({dia:String(d.dia||'Dia'), horario:String(d.horario||''), refeicoes:d.refeicoes.filter(m=>m&&m.prato).map(m=>({
    refeicao:String(m.refeicao||''), prato:String(m.prato), porcao:String(m.porcao||''), preparo:String(m.preparo||''),
    kcal:+m.kcal||0, proteina:+m.proteina||0, carboidratos:+m.carboidratos||0, gorduras:+m.gorduras||0, fibras:+m.fibras||0,
    ingredientes: m.ingredientes ? normIng(m.ingredientes) : null, passos: Array.isArray(m.passos) ? m.passos.map(String) : null }))}));
  const subs = (Array.isArray(r.substituicoes) ? r.substituicoes : []).filter(x=>x&&x.grupo&&Array.isArray(x.itens)).map(x=>({grupo:String(x.grupo), itens:x.itens.map(String)}));
  return ensureIds({fonte, nome:nome||'', formato: r.formato==='opcoes' ? 'opcoes' : 'dias', geradoEm:Date.now(), dias, subs, sel:[], ok:[], vezes:{}, obs:String(r.observacoes||'')});
}
const planMeals = plan => { const out=[]; (plan.dias||[]).forEach((d,di)=>(d.refeicoes||[]).forEach((m,mi)=>out.push({d, m, di, mi, key:m.id||(di+'|'+mi)}))); return out; };
const fmtQty = (q, un) => {
  if (q==null) return un && un!=='a gosto' ? un : 'a gosto';
  if (un==='g' && q>=1000) return nf(q/1000,2)+' kg';
  if (un==='ml' && q>=1000) return nf(q/1000,2)+' L';
  const u = (un==='unidade' && q>1) ? 'unidades' : (un==='fatia' && q>1) ? 'fatias' : un;
  return nf(q,1)+(u ? ' '+u : '');
};
function shoppingList(plan){
  const sel = new Set(plan.sel||[]); const map = {}; const semIng = [];
  planMeals(plan).forEach(x=>{
    if (!sel.has(x.key)) return;
    if (!x.m.ingredientes || !x.m.ingredientes.length){ semIng.push(x); return; }
    const mult = Math.max(1, +((plan.vezes||{})[x.key])||1);
    x.m.ingredientes.forEach(i=>{
      const k = normName(i.nome)+'|'+(i.qtd==null?'':i.un);
      const it = map[k] || (map[k] = {key:k, nome:i.nome, cat:i.cat, un:i.un, qtd:null, vezes:0});
      it.vezes += mult; if (i.qtd!=null) it.qtd = (it.qtd||0) + i.qtd*mult;
    });
  });
  // mesmo ingrediente com unidades diferentes fica junto numa linha só
  const byName = {};
  Object.values(map).forEach(it=>{ const n=normName(it.nome); (byName[n] = byName[n] || {key:n, nome:it.nome, cat:it.cat, partes:[]}).partes.push(it); });
  const items = Object.values(byName).map(g=>({key:g.key, nome:g.nome, cat:g.cat, txt:g.partes.map(p=>fmtQty(p.qtd,p.un)).filter((t,i,a)=>a.indexOf(t)===i).join(' + ')}));
  items.sort((a,b)=>CATS.indexOf(a.cat)-CATS.indexOf(b.cat) || a.nome.localeCompare(b.nome,'pt-BR'));
  return {items, semIng};
}
function savePlanNow(){
  const plan = state.plan; if (!plan) return;
  plan.rev = Date.now();
  if (plan.dias && plan.sel){ const {items} = shoppingList(plan); plan.listaSemana = items.map(i=>i.nome+' — '+i.txt); }
  persistSoon(); run('savePlan', plan).catch(()=>toast('Não consegui salvar o plano na planilha.'));
}
/* IA completa ingredientes de pratos que vieram sem lista (em lotes, para não demorar demais) */
async function fillIngredients(list, onStep){
  const plan = state.plan; const pratos = [];
  list.forEach(x=>{ if (!pratos.some(p=>normName(p.prato)===normName(x.m.prato))) pratos.push({prato:x.m.prato, porcao:x.m.porcao}); });
  for (let i=0; i<pratos.length; i+=6){
    const lote = pratos.slice(i,i+6);
    onStep && onStep(i, pratos.length);
    const prompt = 'Você é uma nutricionista brasileira. Para cada prato abaixo, liste os ingredientes crus necessários para preparar UMA porção (a porção indicada), em quantidades de compra.\n'+
      'Responda SOMENTE com JSON: {"pratos":[{"prato":"igual ao recebido",'+ING_JSON+'}]}\n'+
      'Pratos: '+JSON.stringify(lote);

const newMealId = () => 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
// dá um id fixo para cada refeição (a seleção da lista de compras usa esse id, então não se perde ao apagar/mover)
function ensureIds(plan){
  if (!plan || !plan.dias) return plan;
  const old = new Set(plan.sel||[]), sel = [];
  plan.dias.forEach((d,di)=>(d.refeicoes||[]).forEach((m,mi)=>{
    if (!m.id) { m.id = newMealId(); if (old.has(di+'|'+mi)) sel.push(m.id); }
    else if (old.has(m.id)) sel.push(m.id);
  }));
  plan.sel = sel;
  return plan;
}

/* ================= metas / onboarding ================= */
function calcTargets(p){
  const bmr = 10*p.peso + 6.25*p.altura - 5*p.idade + (p.sexo==='m'?5:-161);
  let kcal = bmr * p.atividade;
  const r = +p.ritmo || 0.5;
  if (p.objetivo==='perder') kcal -= r*1100; else if (p.objetivo==='ganhar') kcal += r*1100*0.6;
  kcal = Math.max(p.sexo==='m'?1500:1200, Math.round(kcal/10)*10);
  const prot = Math.round(p.peso*(p.objetivo==='manter'?1.2:1.6));
  const gord = Math.round(kcal*0.28/9);
  const carb = Math.max(50, Math.round((kcal - prot*4 - gord*9)/4));
  return {metaKcal:kcal, metaProt:prot, metaCarb:carb, metaGord:gord, metaFibra:Math.round(kcal/1000*14), metaAgua: Math.max(6, Math.round(p.peso*35/250))};
}

    try { state.reminders = await run('setReminders', list); toast(list.length ? 'Lembretes criados no Google Agenda' : 'Lembretes removidos'); }

    saveRem.disabled = false; saveRem.textContent='Salvar lembretes';
  }},'Salvar lembretes');
  const body = h('div',{style:'display:flex;flex-direction:column;gap:18px'},
    h('div',{class:'card',style:'margin:0;display:flex;flex-direction:column;gap:10px'}, h('h3',{},'IA (Gemini)'),
      h('ol',{style:'margin:0;padding-left:20px;font-size:14px'}, h('li',{},'Abra ', h('a',{href:'https://aistudio.google.com/apikey',target:'_blank',rel:'noopener'},'aistudio.google.com/apikey'),' com a mesma conta.'), h('li',{},'Toque em "Criar chave de API" e copie.'), h('li',{},'Cole abaixo e salve.')),
      key, saveKey),
    h('div',{class:'card',style:'margin:0;display:flex;flex-direction:column;gap:10px'}, h('h3',{},'Metas'),
      h('p',{class:'muted small',style:'margin:0'}, nf(goals().kcal)+' kcal · P '+goals().p+'g · C '+goals().c+'g · G '+goals().g+'g · Fibras '+goals().f+'g · '+goals().agua+' copos de água'),
      h('button',{class:'btn ghost block',onclick:()=>{ s.close(); openOnboarding(true); }},'Recalcular ou ajustar metas')),
    h('div',{class:'card',style:'margin:0;display:flex;flex-direction:column;gap:10px'}, h('h3',{},'Água e jejum'),
      h('div',{class:'grid2'}, h('label',{class:'f',for:'st-copo'},'Tamanho do copo (ml)',copo), h('label',{class:'f',for:'st-jejum'},'Meta de jejum (horas)',jej)), aviso, saveOpts),
    h('div',{class:'card',style:'margin:0;display:flex;flex-direction:column;gap:10px'}, h('h3',{},'Lembretes'),
      h('p',{class:'muted small',style:'margin:0'},'Os lembretes viram eventos diários num calendário "Prato & Intestino" no seu Google Agenda, com notificação no celular.'), remBox, saveRem),
    h('div',{class:'card',style:'margin:0;display:flex;flex-direction:column;gap:10px'}, h('h3',{},'Conexão com o Google Drive'),
      h('p',{class:'muted small',style:'margin:0'}, cfg ? ('Conectado. '+(outbox.length ? outbox.length+' registro(s) esperando para sincronizar.' : 'Tudo sincronizado.')+(lastSync ? ' Última sincronização: '+hm(lastSync)+'.' : '')) : 'Ainda não conectado.'),
      syncErr ? h('p',{class:'small',style:'margin:0;color:var(--warn)'}, syncErr) : null,
      h('div',{class:'grid2'}, h('button',{class:'btn ghost',onclick:()=>{ syncErr=''; sync(); toast('Sincronizando…'); }},'Sincronizar agora'), h('button',{class:'btn ghost',onclick:()=>{ s.close(); openConnect(); }}, cfg?'Trocar conexão':'Conectar'))),
    state.info.sheetUrl ? h('div',{class:'card',style:'margin:0;display:flex;flex-direction:column;gap:6px'}, h('h3',{},'Seus dados'),
      h('a',{href:state.info.sheetUrl,target:'_blank',rel:'noopener'},'Planilha "Diário Prato & Intestino"'),
      h('a',{href:state.info.folderUrl,target:'_blank',rel:'noopener'},'Pasta no Drive')) : null);
  const s = openSheet('Configurações', body, null);
}

/* ================= conexão ================= */
function openConnect(firstTime){
  const url = h('input',{type:'text',id:'cx-url',placeholder:'https://script.google.com/macros/s/…/exec',autocomplete:'off',value:cfg?cfg.url:''});
  const tok = h('input',{type:'password',id:'cx-token',placeholder:'Cole a chave de acesso',autocomplete:'off',value:cfg?cfg.token:''});
  const go = h('button',{class:'btn primary',onclick:async()=>{
    const u = url.value.trim(), t = tok.value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(u)) { toast('O link precisa ser o do Apps Script e terminar em /exec'); return; }
    if (t.length < 20) { toast('Cole a chave de acesso completa'); return; }
    go.disabled = true; go.textContent = 'Testando…';
    const old = cfg; cfg = {url:u, token:t};
    try { await api('ping', {}); await idb.set('cfg', cfg); s.close(); toast('Conectado ao seu Google Drive'); state.loaded = !!state.entries.length; banner(); render(); sync(); }
    catch(e){ cfg = old; toast(errMsg(e)); go.disabled=false; go.textContent='Conectar'; }
  }},'Conectar');
  const s = openSheet('Conectar ao seu Google', h('div',{style:'display:flex;flex-direction:column;gap:14px'},
    firstTime ? h('p',{style:'margin:0'},'Bem-vinda! Para guardar seus registros no seu Google Drive, cole aqui as duas informações do seu projeto no Apps Script.') : null,
    h('label',{class:'f',for:'cx-url'},'Link do app da Web', h('span',{class:'hint'},'Implantar → Gerenciar implantações → URL (termina em /exec)'), url),
    h('label',{class:'f',for:'cx-token'},'Chave de acesso', h('span',{class:'hint'},'Rode a função mostrarChave no Apps Script e copie do Registro de execução'), tok),
    h('p',{class:'muted small',style:'margin:0'},'Depois de conectado, o app funciona sem internet: os registros ficam no celular e vão para o Drive quando a conexão voltar.')),
    [cfg ? h('button',{class:'btn ghost',onclick:()=>s.close()},'Cancelar') : null, go].filter(Boolean));
}

/* teclado do celular: mantém o painel e o campo digitado acima do teclado */
(function(){
  const vv = window.visualViewport; const root = document.documentElement;
  const fit = () => { if (!vv) return; const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    root.style.setProperty('--kb', kb + 'px'); root.style.setProperty('--vvh', vv.height + 'px'); };
  if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit(); }
  document.addEventListener('focusin', ev => {
    const el = ev.target; if (!el || !el.matches || !el.matches('input, textarea')) return;
    setTimeout(() => { fit(); try { el.scrollIntoView({block:'center', behavior:'smooth'}); } catch(e){} }, 350);
  });
})();

render(); boot();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  let reloaded = false; const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || !hadController) return; reloaded = true; toast('App atualizado'); setTimeout(()=>location.reload(), 800); });
}
})();
</script>
