<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6A4E">
<base target="_blank">
<title>Prato & Intestino</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: app de uma coluna; navegação embaixo (Hoje, Gráficos, Plano, Diário) e botão + flutuante para registrar */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E7EDE6; --ink:#1C2620; --muted:#5E6B63; --line:#D5DDD4;
  --accent:#2E6A4E; --accent-ink:#FFFFFF; --accent-soft:#D7E7DC;
  --stool:#8A5A2B; --stool-soft:#F1E4D3; --warn:#A9472F; --water:#2F6FA8;
  --prot:#2F6FA8; --carb:#C98A1B; --fat:#B04A6B; --kcal:#2E6A4E;
  --display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121815; --surface:#1A221E; --surface-2:#232D28; --ink:#E6EDE8; --muted:#9AA8A0; --line:#2E3A34;
  --accent:#7CC39C; --accent-ink:#0E1A13; --accent-soft:#1F3A2C;
  --stool:#D9A66E; --stool-soft:#3A2B1C; --warn:#E58A70; --water:#4F8FD0;
  --prot:#4F8FD0; --carb:#B07A1C; --fat:#CC6A8C; --kcal:#7CC39C; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding:0 max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 12px}
header.top h1{font-size:26px;line-height:1.05}
.syncpill{border:0;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.syncpill i{width:8px;height:8px;border-radius:99px;background:var(--muted)}
.syncpill.ok i{background:var(--accent)} .syncpill.wait i{background:var(--carb)} .syncpill.off i{background:var(--warn)}
.hbtns{display:flex;gap:8px;align-items:center}
.chip.pend{background:var(--stool-soft)}
.gear{border:0;background:var(--surface-2);width:40px;height:40px;border-radius:999px;display:grid;place-items:center;flex:none}
.banner{background:var(--stool-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.banner button{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{font-size:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;font-size:14px}

/* bichinho */
.pet{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.pet svg{width:96px;height:96px}
.pet .name{font-family:var(--display);font-weight:700;font-size:18px}
.pet .say{font-size:14px;margin-top:2px}
.lvl{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.track>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.streak{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--ink);padding:3px 8px;border-radius:99px;margin-top:6px}
@media (prefers-reduced-motion: no-preference){.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:60px 110px}@keyframes bob{50%{transform:translateY(-3px) scale(1.01,.99)}}}

/* calorias */
.kcal{display:grid;grid-template-columns:128px 1fr;gap:14px;align-items:center}
.ring{position:relative;width:128px;height:128px}
.ring svg{width:128px;height:128px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.macros{display:flex;flex-direction:column;gap:9px;min-width:0}
.macro .row{display:flex;justify-content:space-between;font-size:13px;gap:6px}
.macro .row b{font-weight:600}
.macro .row span{color:var(--muted);font-variant-numeric:tabular-nums}
.macro .track>i{background:var(--c)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}

/* água e jejum */
.cups{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.cup{width:28px;height:34px;border:0;padding:0;background:none}
.cup svg{width:28px;height:34px}
.rowbtns{display:flex;gap:8px;align-items:center}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:40px;height:40px;padding:0 14px;font-weight:600}
.fastbar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:8px 0}
.fastbar i{display:block;height:100%;background:var(--accent)}
.big{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}

/* linha do tempo */
.section-title{font-family:var(--display);font-size:17px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-title small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:8px}
.entry{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.entry .time{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding-top:2px}
.entry .body{min-width:0}
.entry .kind{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:6px}
.entry .kind em{font-style:normal;color:var(--ink);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.entry.meal .kind{color:var(--accent)} .entry.stool .kind{color:var(--stool)}
.entry .title{font-weight:600;margin-top:2px}
.entry .sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.mline{display:flex;gap:10px;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs img{width:60px;height:60px;object-fit:cover;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink);border:0}
.chip.badge{background:var(--accent-soft)}
.chip.alert{background:var(--warn);color:#fff}
.score{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:99px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--ink)}
.stoolrow{display:flex;gap:10px;align-items:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.nav .row{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .plus{width:54px;height:54px;border-radius:999px;background:var(--accent);color:var(--accent-ink);margin:-26px auto 0;box-shadow:0 4px 14px rgba(0,0,0,.18);display:grid;place-items:center;padding:0}

/* botões */
.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.stool{background:var(--stool);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}

/* painel */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;max-height:94%;display:flex;flex-direction:column;
  padding:0 max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left))}
.sheet .inner{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 0 10px;gap:8px}
.sheet-head h3{font-size:20px}
.x{border:0;background:var(--surface-2);border-radius:999px;width:36px;height:36px;font-size:18px;line-height:1;flex:none}
.sheet-body{overflow-y:auto;flex:1;min-height:0;padding-bottom:14px;display:flex;flex-direction:column;gap:14px}
.sheet-foot{padding:10px 0 14px;display:flex;gap:10px;border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.menu b{font-family:var(--display);font-size:17px}
.menu span{font-size:13px;color:var(--muted)}
label.f,.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.f .hint{font-weight:400;font-size:13px;color:var(--muted)}
input[type=datetime-local],input[type=time],input[type=number],textarea,input[type=text],input[type=password],select{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 input{padding:8px 6px;text-align:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opts{display:flex;flex-direction:column;gap:6px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble.me img{width:120px;height:120px;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
.thinking{color:var(--muted);font-style:italic}
.draft{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.item{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .top b{font-weight:600}
.item .nums{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.totals div{background:var(--surface-2);border-radius:10px;padding:6px 2px}
.totals b{display:block;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.totals span{font-size:11px;color:var(--muted)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;border-radius:20px;padding:11px 14px;max-height:120px}
.iconbtn{border:0;width:46px;height:46px;flex:none;border-radius:999px;background:var(--surface-2);display:grid;place-items:center;position:relative;overflow:hidden}
.iconbtn.send{background:var(--accent);color:var(--accent-ink)}
.overlay-file{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.pending{display:flex;gap:6px;flex-wrap:wrap}
.pending .p{position:relative}
.pending img{width:58px;height:58px;object-fit:cover;border-radius:10px}
.pending .p button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-size:12px}

/* bristol */
.bristol{display:grid;gap:6px}
.bopt{display:grid;grid-template-columns:28px 76px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px}
.bopt .n{font-family:var(--display);font-weight:700;font-size:18px;color:var(--stool);text-align:center}
.bopt .t{font-weight:600;font-size:14px} .bopt .d{font-size:13px;color:var(--muted)}
.bopt[aria-pressed="true"]{border-color:var(--stool);background:var(--stool-soft);box-shadow:inset 0 0 0 1px var(--stool)}
.swatch{width:34px;height:34px;border-radius:999px;border:2px solid var(--line)}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}

/* gráficos */
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:13px;min-height:20px;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.axis{fill:var(--muted);font-size:10px;font-family:var(--body)}
.grid{stroke:var(--line);stroke-width:1}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stat b{font-family:var(--display);font-size:20px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.insight ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.insight h4{margin:12px 0 0;font-size:14px}

/* plano */
.day-plan{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.day-plan:first-of-type{border-top:0;margin-top:0;padding-top:0}
.pmeal{display:flex;flex-direction:column;gap:2px;padding:8px 0}
.pmeal .r{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:60;font-size:14px;font-weight:600;text-align:center;max-width:90%}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="eyebrow" id="today-label">Hoje</div><h1 id="page-title">Prato & Intestino</h1></div>
    <div class="hbtns"><button class="syncpill" id="syncpill" aria-label="Sincronizar agora"><i></i><span>…</span></button>
    <button class="gear" id="gear" aria-label="Configurações"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
</div>
<nav class="nav"><div class="row">
  <button data-tab="hoje" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg>Hoje</button>
  <button data-tab="graficos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Gráficos</button>
  <button class="plus" id="plus" aria-label="Registrar"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-tab="plano"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Plano</button>
  <button data-tab="diario"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4"/></svg>Diário</button>
</div></nav>
<div id="sheet-root"></div>

<script>
(() => {
/* ================= utilidades ================= */
const $ = (s, el=document) => el.querySelector(s);
const h = (tag, attrs={}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
};
const fill = (el, ...kids) => { el.replaceChildren(...kids.flat(2).filter(k=>k!=null&&k!==false)); return el; };
const svgEl = (html) => { const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; };
/* ================= armazenamento local + sincronização ================= */
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('prato-intestino', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction('kv', mode); const q = fn(t.objectStore('kv')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }));
  return { get: k => tx('readonly', s => s.get(k)), set: (k, v) => tx('readwrite', s => s.put(v, k)), del: k => tx('readwrite', s => s.delete(k)) };
})();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
let cfg = null, outbox = [], syncing = false, syncErr = '', lastSync = 0;
const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return ''; } })();
async function api(action, payload, timeoutMs = 90000) {
  if (!cfg) throw new Error('Conecte o app à sua conta Google nas configurações.');
  if (!navigator.onLine) throw new Error('Sem internet agora.');
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), timeoutMs);
  let res;

function localResult(fn, args) {

async function run(fn, ...args) {

    if (ckey) outbox = outbox.filter(o => o.ckey !== ckey);
    outbox.push({ qid: uid(), fn, args: JSON.parse(JSON.stringify(args)), ckey });

async function sync() {
  if (syncing || !cfg) return;

  syncing = true; updateSyncPill();
  const first = !state.loaded;
  try {
    const ops = outbox.slice();

    const sent = new Set(ops.map(o => o.qid));
    outbox = outbox.filter(o => !sent.has(o.qid));
    (r.errors || []).forEach(er => toast('Não consegui gravar um registro no Drive: ' + er.error));
    if (!outbox.length) {
      const reacoes = {}; state.entries.forEach(e => { if (e.reacao) reacoes[e.id] = e.reacao; });
      Object.assign(state, r.all, { loaded: true });
      state.entries.forEach(e => { if (reacoes[e.id]) e.reacao = reacoes[e.id]; });
      state.entries.sort((a, b) => b.at - a.at);
    }
    syncErr = ''; lastSync = Date.now();
    persistSoon(); banner(); render();
    if (first && !state.profile) openOnboarding();
    processPending();
  } catch (e) {
    syncErr = errMsg(e);
    if (first && !state.loaded) { state.loaded = true; render(); }
  } finally {
    syncing = false; updateSyncPill();

}

  const level = 1 + Math.floor(xp/120);

  let streak = 0; const d = new Date(); d.setHours(12,0,0,0);
  if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate()-1);
  while (days.has(dayKey(d.getTime()))) { streak++; d.setDate(d.getDate()-1); }
  return {xp, level, into: xp%120, streak};
}

let fastTick = null;
function fastCard(){
  const f = state.fastCurrent, g = goals();
  const card = h('div',{class:'card'});

    const last = state.fasts.slice().sort((a,b)=>b.end-a.end)[0];

      last ? h('p',{class:'muted small',style:'margin:0 0 8px'}, 'Último: '+nf((last.end-last.start)/36e5,1)+'h, terminou '+fmtDay(dayKey(last.end)).toLowerCase()+' às '+hm(last.end)) : null,
      h('button',{class:'btn ghost block',onclick:startFast},'Começar jejum agora')].filter(Boolean));

      const r = await run('askGemini', prompt, imgs);
      applyAI(draft, r); draft.pendente = null;
      think.classList.remove('thinking'); think.replaceChildren(h('div',{}, r.mensagem || 'Anotei. Confere abaixo e salve.'));
    } catch(e){
      think.classList.remove('thinking');
      if (text) draft.resumo = draft.resumo ? draft.resumo+'; '+text : text;
      if (/internet|conexão|demorou/i.test(errMsg(e))) { draft.pendente = {texto: transcript.slice()}; think.replaceChildren(h('div',{}, 'A conexão falhou. Pode salvar: calculo as calorias quando a internet voltar.')); }
      else think.replaceChildren(h('div',{}, errMsg(e)+' Guardei seu texto; dá para adicionar os valores à mão.'));
    } finally { busy=false; drawDraft(); }
  }
  const greet = existing ? null : h('div',{class:'bubble ai'}, state.info.hasKey ? 'Me conta o que você comeu, do jeito que quiser. Pode mandar foto do prato ou do rótulo da embalagem.' : 'Escreva o que você comeu e adicione os itens à mão.');
  const body = h('div',{style:'display:flex;flex-direction:column;gap:14px'},
    h('label',{class:'f',for:'meal-when'},'Quando', when), greet, chat, draftBox, pendBox, composer,
    h('p',{class:'muted small',style:'margin:0'},'Dica: para falar em vez de digitar, use o microfone do teclado do celular.'),
    h('label',{class:'f',for:'meal-note'},'Observação (opcional)', notaIn));
  const s = openSheet(existing ? 'Editar refeição' : 'Nova refeição', body, [h('button',{class:'btn ghost',onclick:()=>s.close()},'Cancelar'), saveBtn]);
  drawDraft();
}

function resize(img, max){ const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c; }

function chartBox(title, legend, svg, cap){ return h('div',{class:'card chart'}, h('h3',{style:'margin-bottom:6px'},title), legend, svg, cap); }
function legendEl(items){ return h('div',{class:'legend'}, items.map(([l,c])=>h('span',{},h('span',{class:'dot',style:'--c:var('+c+')'}),l))); }
function niceMax(v){ if (v<=0) return 10; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
// barras empilhadas (ou simples) com linha de meta; toque mostra valores
function barChart(keys, series, opts){
  const W=340, H=180, L=36, Rr=8, T=10, B=24, iw=W-L-Rr, ih=H-T-B;
  const totals = keys.map((_,i)=>series.reduce((s,se)=>s+se.values[i],0));
  const rawMax = Math.max(opts.goal||0, ...totals)*1.05;
  const max = opts.int ? Math.max(4, Math.ceil(rawMax/4)*4) : niceMax(rawMax);
  const y = v => T+ih-(v/max)*ih;
  const bw = Math.min(26, iw/keys.length*0.62), step = iw/keys.length;
  let g = '';
  for (let k=0;k<=4;k++){ const v=max*k/4, yy=y(v); g+='<line class="grid" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+yy+'" y2="'+yy+'"/><text class="axis" x="'+(L-6)+'" y="'+(yy+3)+'" text-anchor="end">'+nf(v)+'</text>'; }
  const labelEvery = keys.length>14 ? 5 : keys.length>7 ? 2 : 1;
  keys.forEach((k,i)=>{
    const x = L+step*i+(step-bw)/2; let acc = 0;
    series.forEach((se,si)=>{ const v=se.values[i]; if (v<=0) return; const y0=y(acc), y1=y(acc+v); const top = si===series.length-1 || series.slice(si+1).every(s2=>s2.values[i]<=0);
      const hgt = Math.max(1, y0-y1-(acc>0?2:0));
      g += top ? '<path d="M'+x+' '+(y1+hgt)+' V'+(y1+Math.min(4,hgt))+' q0 -4 4 -4 H'+(x+bw-4)+' q4 0 4 4 V'+(y1+hgt)+' z" fill="var('+se.color+')"/>' : '<rect x="'+x+'" y="'+y1+'" width="'+bw+'" height="'+hgt+'" fill="var('+se.color+')"/>';
      acc += v; });
    if (i%labelEvery===0 || i===keys.length-1) g+='<text class="axis" x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+shortDay(k)+'</text>';
    g += '<rect data-i="'+i+'" x="'+(L+step*i)+'" y="'+T+'" width="'+step+'" height="'+ih+'" fill="transparent" style="cursor:pointer"><title>'+shortDay(k)+'</title></rect>';
  });
  if (opts.goal){ const gy=y(opts.goal); g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/><text class="axis" x="'+(W-Rr)+'" y="'+(gy-4)+'" text-anchor="end" style="fill:var(--ink);font-weight:600">meta '+nf(opts.goal)+'</text>'; }
  const svg = svgEl('<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+opts.label+'">'+g+'</svg>');
  const cap = h('div',{class:'cap'}, opts.hint||'Toque numa barra para ver os valores.');
  svg.addEventListener('click', ev => { const i = ev.target.getAttribute && ev.target.getAttribute('data-i'); if (i==null) return; cap.textContent = fmtDay(keys[i])+': '+opts.fmt(+i); });
  return {svg, cap};
}
function lineChart(points, opts){
  const W=340, H=170, L=38, Rr=10, T=12, B=24, iw=W-L-Rr, ih=H-T-B;
  const vals = points.map(p=>p.v); let lo=Math.min(...vals), hi=Math.max(...vals); if (hi-lo<2){ lo-=1; hi+=1; } const padv=(hi-lo)*0.15; lo-=padv; hi+=padv;
  const t0 = points[0].t, t1 = points[points.length-1].t || t0+1;
  const x = t => L + (t1===t0 ? iw/2 : (t-t0)/(t1-t0)*iw), y = v => T+ih-(v-lo)/(hi-lo)*ih;
  let g='';
  for (let k=0;k<=3;k++){ const v=lo+(hi-lo)*k/3, yy=y(v); g+='<line class="grid" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+yy+'" y2="'+yy+'"/><text class="axis" x="'+(L-6)+'" y="'+(yy+3)+'" text-anchor="end">'+nf(v,1)+'</text>'; }
  g += '<polyline points="'+points.map(p=>x(p.t)+','+y(p.v)).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  points.forEach((p,i)=>{ g+='<circle cx="'+x(p.t)+'" cy="'+y(p.v)+'" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><circle data-i="'+i+'" cx="'+x(p.t)+'" cy="'+y(p.v)+'" r="14" fill="transparent" style="cursor:pointer"/>'; });
  [0, points.length-1].forEach(i=>{ const p=points[i]; g+='<text class="axis" x="'+x(p.t)+'" y="'+(H-8)+'" text-anchor="'+(i?'end':'start')+'">'+dataStr(p.t).slice(0,5)+'</text>'; });
  if (opts.goal){ const gy=y(opts.goal); if (gy>T && gy<T+ih) g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/>'; }
  const svg = svgEl('<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+opts.label+'">'+g+'</svg>');
  const cap = h('div',{class:'cap'}, 'Toque num ponto para ver o valor.');
  svg.addEventListener('click', ev => { const i = ev.target.getAttribute && ev.target.getAttribute('data-i'); if (i==null) return; const p=points[+i]; cap.textContent = dataStr(p.t)+': '+nf(p.v,1)+' kg'; });
  return {svg, cap};
}

    v.append(h('div',{class:'card'}, h('h3',{},'De onde vêm suas calorias'), legendEl([['Proteína','--prot'],['Carboidrato','--carb'],['Gordura','--fat']]),
      barRow('Sua média', [[kp,'--prot','P'],[kcb,'--carb','C'],[kg,'--fat','G']]), barRow('Sua meta', [[tp,'--prot','P'],[tc,'--carb','C'],[tg,'--fat','G']])));

function insightCard(){

    const sec = (t, arr, fn) => (arr&&arr.length) ? [h('h4',{},t), h('ul',{}, arr.map(x=>h('li',{}, fn(x))))] : [];

  }
  card.append(btn);
  async function genInsight(){
    if (!state.info.hasKey){ openSettings(); return; }
    btn.disabled = true; btn.textContent = 'Analisando…';

/* ================= metas / onboarding ================= */
function calcTargets(p){
  const bmr = 10*p.peso + 6.25*p.altura - 5*p.idade + (p.sexo==='m'?5:-161);
  let kcal = bmr * p.atividade;
  const r = +p.ritmo || 0.5;
  if (p.objetivo==='perder') kcal -= r*1100; else if (p.objetivo==='ganhar') kcal += r*1100*0.6;
  kcal = Math.max(p.sexo==='m'?1500:1200, Math.round(kcal/10)*10);
  const prot = Math.round(p.peso*(p.objetivo==='manter'?1.2:1.6));
  const gord = Math.round(kcal*0.28/9);
  const carb = Math.max(50, Math.round((kcal - prot*4 - gord*9)/4));
  return {metaKcal:kcal, metaProt:prot, metaCarb:carb, metaGord:gord, metaFibra:Math.round(kcal/1000*14), metaAgua: Math.max(6, Math.round(p.peso*35/250))};
}

  const s = openSheet('Conectar ao seu Google', h('div',{style:'display:flex;flex-direction:column;gap:14px'},
    firstTime ? h('p',{style:'margin:0'},'Bem-vinda! Para guardar seus registros no seu Google Drive, cole aqui as duas informações do seu projeto no Apps Script.') : null,
    h('label',{class:'f',for:'cx-url'},'Link do app da Web', h('span',{class:'hint'},'Implantar → Gerenciar implantações → URL (termina em /exec)'), url),
    h('label',{class:'f',for:'cx-token'},'Chave de acesso', h('span',{class:'hint'},'Rode a função mostrarChave no Apps Script e copie do Registro de execução'), tok),
    h('p',{class:'muted small',style:'margin:0'},'Depois de conectado, o app funciona sem internet: os registros ficam no celular e vão para o Drive quando a conexão voltar.')),
    [cfg ? h('button',{class:'btn ghost',onclick:()=>s.close()},'Cancelar') : null, go].filter(Boolean));
}

render(); boot();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  let reloaded = false; const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || !hadController) return; reloaded = true; toast('App atualizado'); setTimeout(()=>location.reload(), 800); });
}
})();
</script>
</body>
